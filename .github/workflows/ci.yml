name: ci

# Devbox, checked on every push and pull request: dist/ is what src/ builds to (it is committed, so a host installing
# from git builds nothing), and the tests pass (transform.js in Node; the console in headless Chrome, which the runner
# image has, under the hub's policies).
on:
  push:
  pull_request:

jobs:
  devbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: dist/ matches src/
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "::error::dist/ differs from what src/ builds to: run npm run build and commit dist/"; exit 1; }
      - run: npm test
